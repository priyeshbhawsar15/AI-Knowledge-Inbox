name: ai-knowledge-inbox-test

services:
  fake-services:
    build:
      context: .
      dockerfile: Dockerfile.test
    command: npx tsx tests/fixtures/startTestServices.ts
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/fixture-article.html').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: node apps/api/dist/index.js
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=test
      - DATABASE_PATH=/data/knowledge.db
      - LOG_LEVEL=info
      - AI_BASE_URL=http://fake-services:8080/v1
      - AI_API_KEY=test-fake-key
      - EMBEDDING_MODEL=text-embedding-3-small
      - EMBEDDING_DIMENSIONS=1536
      - CHAT_MODEL=gpt-4o-mini
      - MIN_RELEVANCE_SCORE=0.0
      - TEST_ALLOWED_HOSTS=fake-services,localhost,127.0.0.1
    volumes:
      - knowledge-test-data:/data
    depends_on:
      fake-services:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node apps/worker/dist/index.js
    environment:
      - NODE_ENV=test
      - DATABASE_PATH=/data/knowledge.db
      - LOG_LEVEL=info
      - AI_BASE_URL=http://fake-services:8080/v1
      - AI_API_KEY=test-fake-key
      - EMBEDDING_MODEL=text-embedding-3-small
      - EMBEDDING_DIMENSIONS=1536
      - CHAT_MODEL=gpt-4o-mini
      - TEST_ALLOWED_HOSTS=fake-services,localhost,127.0.0.1
    volumes:
      - knowledge-test-data:/data
    depends_on:
      fake-services:
        condition: service_healthy

volumes:
  knowledge-test-data:
    driver: local
